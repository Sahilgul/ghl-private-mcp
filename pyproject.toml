[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghl-mcp"
version = "0.2.0"
description = "Standalone FastMCP server exposing all 92 GHL Private Integration Token tools over stdio or HTTP."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# Run as stdio subprocess:  ghl-mcp-stdio
# Run as HTTP service:       ghl-mcp-http [--host 0.0.0.0] [--port 8000]
ghl-mcp-stdio = "ghl_mcp.server:run_stdio"
ghl-mcp-http  = "ghl_mcp.server:run_http"

[tool.hatch.build.targets.wheel]
packages = ["src/ghl_mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["S101"]
