steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/ghl-private-mcp:$COMMIT_SHA
      - .

  # Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/ghl-private-mcp:$COMMIT_SHA

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ghl-private-mcp          # Cloud Run service name (keep as-is or rename)
      - --image=gcr.io/$PROJECT_ID/ghl-private-mcp:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-secrets=GHL_PIT_TOKEN=GHL_PIT_TOKEN:latest,GHL_LOCATION_ID=GHL_LOCATION_ID:latest

images:
  - gcr.io/$PROJECT_ID/ghl-private-mcp:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
