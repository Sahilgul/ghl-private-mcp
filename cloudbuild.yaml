steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/meetvexa/cloud-run-source-deploy/ghl-private-mcp:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/meetvexa/cloud-run-source-deploy/ghl-private-mcp:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ghl-private-mcp
      - --image=us-central1-docker.pkg.dev/meetvexa/cloud-run-source-deploy/ghl-private-mcp:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-secrets=MCP_API_KEY=MCP_API_KEY:latest
      - --quiet

images:
  - us-central1-docker.pkg.dev/meetvexa/cloud-run-source-deploy/ghl-private-mcp:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
